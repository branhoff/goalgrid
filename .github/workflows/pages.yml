name: Pages

# Deploys the hosted watchface config/onboarding page (web/) to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source = "GitHub Actions".
# The watch opens https://brandon-hoffman.is-a.dev/goalgrid/ (see src/pkjs/config.js CONFIG_URL);
# the plain branhoff.github.io/goalgrid/ URL 301-redirects to that custom domain.
# Note: the Generate-token button also needs ring-capture to CORS-allowlist this origin.

on:
  push:
    branches: [main]
    paths: [web/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; never cancel it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
