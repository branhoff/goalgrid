[project]
name = "habit-hooks-c"
version = "0.1.0"
description = "Structural-smell sensors for C (function/file size, nesting, parameters, narrating comments)"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/habit_hooks_c"]

[project.entry-points."habit_hooks.plugins"]
c = "habit_hooks_c"
